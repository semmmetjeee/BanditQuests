# Generic types:
# BLOCK_BREAK, BLOCK_PLACE, CHAT, KILL_PLAYER, KILL_MOB, FISH, PLAY_MINUTES, JOIN
#
# filters.whitelist: only these materials/entity types count.
# filters.blacklist: everything counts except these materials/entity types.
# Leave both lists empty to count all matching events.
quests:
  gold_rush:
    type: BLOCK_BREAK
    goal: 32
    rewards:
      marks: 30
    filters:
      whitelist: [GOLD_ORE, DEEPSLATE_GOLD_ORE]
      blacklist: []
    display:
      icon: GOLD_ORE
      name: "&#f4b52b&lGOLD RUSH"
      description:
        - "&fBreak gold ore for the Saloon."
  outlaw_miner:
    type: BLOCK_BREAK
    goal: 64
    rewards:
      marks: 55
    filters:
      whitelist: []
      blacklist: [STONE, DEEPSLATE, DIRT, GRASS_BLOCK]
    display:
      icon: DIAMOND_PICKAXE
      name: "&#e3262e&lOUTLAW MINER"
      description:
        - "&fBreak any valuable block."
        - "&7Stone, deepslate and dirt do not count."
  builder:
    type: BLOCK_PLACE
    goal: 128
    rewards:
      marks: 28
    filters:
      whitelist: [OAK_PLANKS, SPRUCE_PLANKS, COBBLESTONE, STONE_BRICKS]
      blacklist: []
    display:
      icon: BRICKS
      name: "&#f4b52b&lFRONTIER BUILDER"
      description:
        - "&fPlace building blocks for your settlement."
  chatterbox:
    type: CHAT
    goal: 12
    options:
      minimum-chat-length: 8
    rewards:
      marks: 16
    display:
      icon: WRITABLE_BOOK
      name: "&#f4b52b&lSALOON CHATTER"
      description:
        - "&fSend 12 meaningful chat messages."
  gunslinger:
    type: KILL_PLAYER
    goal: 4
    rewards:
      marks: 48
    display:
      icon: IRON_SWORD
      name: "&#e3262e&lGUNSLINGER"
      description:
        - "&fDefeat 4 rival players."
  varmint_hunter:
    type: KILL_MOB
    goal: 30
    filters:
      whitelist: [ZOMBIE, SKELETON, CREEPER, SPIDER]
      blacklist: []
    rewards:
      marks: 24
    display:
      icon: CROSSBOW
      name: "&#f4b52b&lVARMINT HUNTER"
      description:
        - "&fHunt hostile creatures."
  river_rat:
    type: FISH
    goal: 12
    rewards:
      marks: 18
    display:
      icon: FISHING_ROD
      name: "&#f4b52b&lRIVER RAT"
      description:
        - "&fCatch fish from any river."
  long_ride:
    type: PLAY_MINUTES
    goal: 60
    rewards:
      marks: 25
    display:
      icon: CLOCK
      name: "&#f4b52b&lLONG RIDE"
      description:
        - "&fSpend an hour on the frontier."
  daily_regular:
    type: JOIN
    goal: 1
    rewards:
      marks: 8
    display:
      icon: OAK_HANGING_SIGN
      name: "&#f4b52b&lDAILY REGULAR"
      description:
        - "&fVisit the Saloon today."
