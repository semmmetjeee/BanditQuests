# Autumn / Halloween Quest Pass
# Every category has 10 independently configurable levels.
# Supported types: BLOCK_BREAK, BLOCK_PLACE, CHAT, KILL_PLAYER, KILL_MOB, FISH, PLAY_MINUTES, JOIN
# Each rewards.commands entry is dispatched by console as soon as that level is completed.
# Available placeholders: %player%, %quest%, %level%, %goal%
